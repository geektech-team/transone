name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/transone/**'
      - 'packages/transone-cli/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 固定到本地验证过的版本，避免 latest 漂移导致 install 行为不一致
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build documentation
        # 文档站由 @geektech/tsone 构建（tsone build 静态多页 + SSR），
        # 框架与 CLI 以 npm 依赖形式安装，无需在 CI 先构建本地包。
        # 站点从 GitHub Pages 项目子路径提供服务（如
        # https://<owner>.github.io/transone/），base 取仓库名。
        run: bun run docs:build -- --base=/${{ github.event.repository.name }}/

      - name: Build CLI documentation
        # CLI 文档部署在同一 Pages 站点下，合并进 docs/dist/cli/
        # （如 https://<owner>.github.io/transone/cli/）。
        run: bun run docs:cli:build -- --base=/${{ github.event.repository.name }}/cli/

      - name: Merge documentation into the Pages site
        # tsone build 把产物输出到各项目根下的 dist，CLI 文档落在
        # packages/transone-cli/docs/dist。合并进 Pages 部署目录。
        run: |
          mkdir -p docs/dist/cli
          cp -r packages/transone-cli/docs/dist/. docs/dist/cli/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
